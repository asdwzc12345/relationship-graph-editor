<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">关系图编辑器</title>
  <desc id="desc">由三个连接节点组成的关系图标志</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="18" x2="226" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7467ff"/>
      <stop offset=".52" stop-color="#526df5"/>
      <stop offset="1" stop-color="#23b9d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(66 42) rotate(48) scale(210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17216a" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect width="256" height="256" rx="60" fill="url(#glow)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M78 91 128 60l50 31v74l-50 31-50-31z" stroke-opacity=".86" stroke-width="13"/>
    <path d="m128 79-39 72m78 0-39-72m-32 86h64" stroke-width="13"/>
    <circle cx="128" cy="60" r="20" fill="#fff" stroke-width="9"/>
    <circle cx="78" cy="165" r="20" fill="#fff" stroke-width="9"/>
    <circle cx="178" cy="165" r="20" fill="#fff" stroke-width="9"/>
  </g>
</svg>
